name: Swift

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/cli/tests/fixtures/protocol/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/cli/tests/fixtures/protocol/**"
      - ".github/workflows/swift.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Shared package tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      COVERAGE_MIN: "95"
    defaults:
      run:
        working-directory: app/JaumKit
    steps:
      - uses: actions/checkout@v5
      - name: Test with coverage
        run: >
          xcodebuild test -scheme JaumKit -destination 'platform=macOS'
          -enableCodeCoverage YES -resultBundlePath TestResults.xcresult
      - name: Enforce minimum line coverage
        run: |
          cov=$(xcrun xccov view --report --json TestResults.xcresult \
            | jq -r '[.targets[] | select(.name | startswith("JaumKit") and (contains("Tests") | not))][0].lineCoverage')
          if [ "$cov" = "null" ] || [ -z "$cov" ]; then
            echo "::error::JaumKit target missing from the coverage report"
            exit 1
          fi
          pct=$(awk -v c="$cov" 'BEGIN { printf "%.4f", c * 100 }')
          printf 'Line coverage (JaumKit): %.2f%% (minimum: %s%%)\n' "$pct" "$COVERAGE_MIN"
          printf 'Line coverage (JaumKit): %.2f%% (minimum: %s%%)\n' "$pct" "$COVERAGE_MIN" >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$pct" -v m="$COVERAGE_MIN" 'BEGIN { exit !(p < m) }'; then
            printf '::error::Line coverage %.2f%% is below the %s%% minimum\n' "$pct" "$COVERAGE_MIN"
            exit 1
          fi

  app:
    name: macOS app tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      COVERAGE_MIN: "95"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Test with coverage
        run: >
          xcodebuild test -project Jaum.xcodeproj -scheme Jaum
          -destination 'platform=macOS' -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
      - name: Enforce minimum line coverage
        run: |
          cov=$(xcrun xccov view --report --json TestResults.xcresult \
            | jq -r '[.targets[] | select(.name | startswith("Jaum.app"))][0].lineCoverage')
          if [ "$cov" = "null" ] || [ -z "$cov" ]; then
            echo "::error::Jaum.app target missing from the coverage report"
            exit 1
          fi
          pct=$(awk -v c="$cov" 'BEGIN { printf "%.4f", c * 100 }')
          printf 'Line coverage (Jaum.app): %.2f%% (minimum: %s%%)\n' "$pct" "$COVERAGE_MIN"
          printf 'Line coverage (Jaum.app): %.2f%% (minimum: %s%%)\n' "$pct" "$COVERAGE_MIN" >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$pct" -v m="$COVERAGE_MIN" 'BEGIN { exit !(p < m) }'; then
            printf '::error::Line coverage %.2f%% is below the %s%% minimum\n' "$pct" "$COVERAGE_MIN"
            exit 1
          fi
